name: Sandbox validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    name: Offline Rust CLI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the sandbox from tracked workspace files
        shell: bash
        run: |
          context=$(mktemp -d "$RUNNER_TEMP/sandbox.XXXXXXXX")
          trap 'rm -rf -- "$context"' EXIT
          git archive HEAD Cargo.toml Cargo.lock rust-toolchain.toml crates skills evaluation/cases.json \
            | tar -xf - -C "$context"
          docker build --file - --tag revayat-novel:sandbox "$context" < tests/sandbox/Dockerfile
      - name: Check doctor, Persian lint, and evaluation without network or writes
        shell: bash
        run: |
          sandbox=(docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges)
          [[ "$(docker image inspect --format '{{.Config.User}}' revayat-novel:sandbox)" == '65532:65532' ]]
          "${sandbox[@]}" revayat-novel:sandbox doctor --json \
            | jq -e '.version == "3.0.0" and .requires_python == false and (.fonts | length == 5 and all(.[]; . == true)) and all(.optional_tools[]; . == null)'
          printf '%s\n' 'این کتاب را می‌خوانم.' \
            | "${sandbox[@]}" -i revayat-novel:sandbox persian-lint --check --style
          printf '%s\n' 'این كتاب را می خوانم.' \
            | "${sandbox[@]}" -i revayat-novel:sandbox persian-lint --fix \
            | cmp - <(printf '%s\n' 'این کتاب را می‌خوانم.')
          answers=$(mktemp "$RUNNER_TEMP/answers.XXXXXXXX.json")
          trap 'rm -f -- "$answers"' EXIT
          jq '.cases | map({key: .id, value: .accepts[0]}) | from_entries' evaluation/cases.json > "$answers"
          chmod a+r "$answers"
          "${sandbox[@]}" --mount "type=bind,src=$answers,dst=/answers.json,readonly" \
            revayat-novel:sandbox eval-score --answers /answers.json --json \
            | jq -e '(.cases | length == 28 and all(.[]; .verdict == "pass")) and .overall == null'
