name: Audit replay snapshot

# A portable checkout for reproducing a specific audit when Git transport is
# unavailable. Archive tracked files only, never credentials or working books.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-replay.yml"
  pull_request:
    paths:
      - ".github/workflows/audit-replay.yml"
      # A repair's exact checkout and wheels must be reproducible before merge,
      # not only after someone edits the exporter or dispatches it manually.
      - "skills/revayat-novel/scripts/**"
      - "tests/**"
      - "skills/revayat-novel/requirements*.txt"
      - "constraints-ci.txt"
      - "requirements-lint.txt"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record the exact checkout and archive tracked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p replay-evidence
          logfile="replay-evidence/audit-export_$(date -u +%Y-%m-%d_%H-%M-%S)_UTC.log"
          log() {
            local level="$1"; shift
            case "$level" in INFO|WARNING|ERROR|DEBUG) ;; *) return 2 ;; esac
            printf '[%s UTC] [%s] [export] %s\n' "$(date -u '+%Y-%m-%d %H:%M:%S')" "$level" "$*" | tee -a "$logfile"
          }
          trap 'log ERROR "Source replay export failed"' ERR
          log INFO "Exporting tracked source and its exact history"
          mkdir -p replay-evidence
          git rev-parse HEAD > replay-evidence/commit.txt
          git ls-tree -r HEAD > replay-evidence/tracked-tree.txt
          git archive --format=zip --output=replay-evidence/source.zip HEAD
          (cd replay-evidence && sha256sum source.zip > source.sha256)
          git bundle create replay-evidence/source.bundle HEAD
          git bundle verify replay-evidence/source.bundle
          (cd replay-evidence && sha256sum source.bundle > bundle.sha256)
          log DEBUG "Git bundle verified against the checked-out commit"
          log WARNING "Committed history is included; local Rules and untracked books are not"
          log INFO "Source replay ready"
      - uses: actions/upload-artifact@v7
        with:
          name: source-replay-${{ github.sha }}
          path: replay-evidence/
          if-no-files-found: error
          retention-days: 7

  wheelhouse:
    # Runs alongside source replay for relevant PRs or an explicit dispatch;
    # it does not replace the existing CI matrix or its no-skip gates.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the pinned audit dependencies for offline Linux replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          python -m pip wheel --wheel-dir wheelhouse \
            -r skills/revayat-novel/requirements.txt \
            -r skills/revayat-novel/requirements-optional.txt \
            -r requirements-lint.txt -c constraints-ci.txt
          python --version > wheelhouse/interpreter.txt
          git rev-parse HEAD > wheelhouse/source-commit.txt
          (cd wheelhouse && sha256sum ./*.whl > wheels.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: audit-wheels-linux-py313-${{ github.sha }}
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 7
