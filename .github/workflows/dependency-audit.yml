name: Dependency audit

# The question nothing else here asks: **is what a reader installs today
# vulnerable?**
#
# `dependency-review.yml` runs on pull requests and reviews only the
# dependencies a PR *changed*, so a week with no dependency commit is a week it
# says nothing — correctly, because there was nothing to review. `codeql.yml`
# analyses this project's own Python, not PyPI advisories. And Dependabot's pip
# *version* updates are disabled on purpose (see dependabot.yml), leaving its
# security updates as the only channel, against the manifest rather than a
# resolution of it.
#
# But the answer changes when an advisory is **published**, not when somebody
# pushes. Hence a schedule.
#
# There is no lockfile, so three different installed sets are audited, and the
# labels say which is which. `pip-audit -r` on a manifest of `>=` ranges resolves
# each requirement to the **latest** version that satisfies it — so auditing
# `requirements.txt` directly answers "is today's resolution vulnerable", not
# "are the floors vulnerable", and calling it floor coverage was wrong twice: it
# duplicated the resolution audit below and left the oldest supported set — the
# one a reader with a warm pip cache or an old constraint actually gets —
# unexamined. The `floors` job does that, on the interpreter the oldest set
# installs on, from the same `dependency-floors.json` the supported-range lane
# pins from.
#
# The two optional wheels are audited too, below and in `windows-optional`. They used
# to be excluded here, with this comment saying so: "ocrmypdf and pywin32 are not
# declared dependencies and are therefore NOT covered". Undeclared is not the
# same as optional, and the exclusion fell on the worst two candidates — the tool
# that forks Tesseract and Ghostscript over a PDF from an untrusted source, and
# the one that drives a COM automation server. They are declared in
# `skills/revayat-novel/requirements-optional.txt` now, so both pip and this scan
# can see them.
#
# Tesseract and Ghostscript themselves remain outside any pip audit: they are
# binaries, not wheels. `doctor` locates them and a reader updates them through
# their own package manager.
#
# Off the push path on purpose, like integration.yml: a newly published advisory
# is not a reason to fail an unrelated commit.
on:
  schedule:
    # Weekly, early Monday UTC — an hour after the OCR tier, so two heavy
    # scheduled jobs do not start together.
    - cron: "41 5 * * 1"
  workflow_dispatch:
  # And when the set being audited changes. A pin raised in a pull request used
  # to be audited on the following Monday, which is a week of a version nobody
  # had asked the advisory database about.
  pull_request:
    paths:
      - "skills/revayat-novel/requirements.txt"
      - "skills/revayat-novel/requirements-optional.txt"
      - "constraints-ci.txt"
      - "requirements-lint.txt"
      - "dependency-floors.json"
      - ".github/workflows/dependency-audit.yml"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit the installed set
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pip-audit
        # Pinned for the same reason the ruff step is: a tool whose output gates
        # a build must not change under the build's feet. Raise it deliberately.
        run: python -m pip install pip-audit==2.10.1

      - name: Audit the declared ranges as pip resolves them today
        # Not the floors: `-r` on `pymupdf>=1.24.3` audits the newest release
        # that satisfies it. Kept because it is the cheapest form of the
        # resolution question and it reads the manifest's markers and extras
        # rather than a freeze of them.
        run: pip-audit -r skills/revayat-novel/requirements.txt

      # Each resolution audit below builds its own virtualenv rather
      # than installing into the one that holds pip-audit. Freezing the tool's
      # environment would audit pip-audit's own ~28 dependencies alongside this
      # project's, so an advisory against a CI tool would fail the build as
      # though a reader were exposed to it.
      - name: Audit what actually resolves today
        # The floors say what is permitted; this says what `pip install -r`
        # produces this morning, which is what a reader runs.
        run: |
          python -m venv /tmp/floors-env
          /tmp/floors-env/bin/python -m pip install --quiet --upgrade pip
          /tmp/floors-env/bin/python -m pip install --quiet \
            -r skills/revayat-novel/requirements.txt
          /tmp/floors-env/bin/python -m pip freeze > resolved-floors.txt
          pip-audit -r resolved-floors.txt

      - name: Audit the optional wheels a reader adds separately
        # `requirements-optional.txt` declares no floors, on purpose: nothing has
        # ever run an old ocrmypdf here, so a floor would be an untested claim.
        # With no floor there is only one question to ask — what resolves — and
        # this is it. The Windows half of the set is in the job below, because
        # `pywin32` carries a `sys_platform` marker that is false on this runner.
        run: |
          python -m venv /tmp/optional-env
          /tmp/optional-env/bin/python -m pip install --quiet --upgrade pip
          /tmp/optional-env/bin/python -m pip install --quiet \
            -r skills/revayat-novel/requirements-optional.txt
          /tmp/optional-env/bin/python -m pip freeze > resolved-optional.txt
          pip-audit -r resolved-optional.txt

      - name: Audit the pinned set CI installs
        # A different question from the one above, and it can have a different
        # answer: constraints-ci.txt holds exact versions, so it can be
        # vulnerable at a version the floors' latest resolution has moved past.
        # The floors are what a *reader* gets; this is what the build gets.
        run: |
          python -m venv /tmp/pinned-env
          /tmp/pinned-env/bin/python -m pip install --quiet --upgrade pip
          /tmp/pinned-env/bin/python -m pip install --quiet \
            -r skills/revayat-novel/requirements.txt -c constraints-ci.txt
          /tmp/pinned-env/bin/python -m pip freeze > resolved-pinned.txt
          pip-audit -r resolved-pinned.txt

  floors:
    name: the exact oldest set a reader can install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Which interpreter the oldest set installs on
        id: floors
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          record = json.loads(pathlib.Path("dependency-floors.json").read_text("utf-8"))
          print(f"interpreter={record['interpreter']}")
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: "${{ steps.floors.outputs.interpreter }}"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      # The floors, pinned exactly, from the one tracked list — the same set
      # `supported-range.yml` runs the suite against. This is the environment a
      # reader gets from an old constraint or a warm cache, and it is the one the
      # audit had never looked at.
      - name: Audit the floors, pinned
        shell: bash
        run: |
          python - <<'PY' > /tmp/constraints-floors.txt
          import json, pathlib
          record = json.loads(pathlib.Path("dependency-floors.json").read_text("utf-8"))
          for name, pin in record["pins"].items():
              print(f"{name}=={pin}")
          PY
          python -m venv /tmp/floor-env
          /tmp/floor-env/bin/python -m pip install --quiet --upgrade pip
          # Binary only, for the reason supported-range.yml gives: a floor that
          # resolves to a source build is not a floor a reader can install.
          /tmp/floor-env/bin/python -m pip install --quiet --only-binary=:all:             -r skills/revayat-novel/requirements.txt -c /tmp/constraints-floors.txt
          /tmp/floor-env/bin/python -m pip freeze > resolved-oldest.txt
          cat resolved-oldest.txt
          pip-audit -r resolved-oldest.txt

      - name: Keep the set that was audited
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audited-floors
          path: resolved-oldest.txt
          if-no-files-found: warn
          retention-days: 14

  windows-optional:
    name: the optional wheel only Windows selects
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      # A job of its own for one wheel, because a marker cannot be audited on a
      # platform where it evaluates false. `pywin32` is how the render-QA path
      # drives Word through COM, so it is exactly the kind of dependency an
      # advisory matters for, and the Linux job above can never see it.
      - name: Audit what Windows resolves
        shell: bash
        run: |
          python -m venv optional-env
          optional-env/Scripts/python -m pip install --quiet --upgrade pip
          optional-env/Scripts/python -m pip install --quiet \
            -r skills/revayat-novel/requirements-optional.txt
          optional-env/Scripts/python -m pip freeze > resolved-optional.txt
          # Proof the marker actually selected it. Without this the job would
          # pass identically if pywin32 were silently dropped from the manifest,
          # which is the one thing it exists to notice.
          grep -iq '^pywin32==' resolved-optional.txt \
            || { echo "::error::pywin32 did not resolve on Windows"; exit 1; }
          pip-audit -r resolved-optional.txt
