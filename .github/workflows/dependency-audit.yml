name: Dependency audit

on:
  push:
    branches: [main]
    paths: &audit-paths
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    paths: *audit-paths
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Audit Cargo.lock against RustSec
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install --locked cargo-audit --version 0.23.0
      - run: cargo audit
