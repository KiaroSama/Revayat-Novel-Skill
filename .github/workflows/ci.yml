name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  rust-build-and-test:
    name: Rust build and test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, exe: revayat-novel, test: true }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: revayat-novel, test: true }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc, exe: revayat-novel.exe, test: true }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, exe: revayat-novel.exe, test: false }
    defaults:
      run:
        shell: pwsh
    env:
      RUST_TARGET: ${{ matrix.target }}
      RUSTUP_TOOLCHAIN: 1.100.0-${{ matrix.target }}
      REVAYAT_BINARY: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned target toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and stage the release binary
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --workspace --release --locked --target $env:RUST_TARGET --bin revayat-novel
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item "target/$env:RUST_TARGET/release/$env:REVAYAT_BINARY" bin
      - name: Run the target binary
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $doctor = & "./bin/$env:REVAYAT_BINARY" doctor --json | ConvertFrom-Json
          if ($doctor.version -ne '3.0.0' -or $doctor.build_target -cne $env:RUST_TARGET -or
              $doctor.requires_python -cne $false -or $doctor.fonts.'Vazirmatn-Regular.ttf' -cne $true) {
            throw 'The target binary did not report the expected version, target, and font.'
          }
      - name: Upload the unsigned CI build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: revayat-novel-${{ matrix.target }}
          path: bin/${{ matrix.exe }}
          if-no-files-found: error
      - name: Test the workspace
        if: matrix.test
        run: cargo test --workspace --locked

  fmt-and-clippy:
    name: Rust formatting and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  pure-rust-and-manifest-guard:
    name: Rust-only tree, manifests, skills, and fonts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tracked source and package metadata
        shell: bash
        run: |
          legacy=$(git ls-files -- ':(icase)*.py' ':(icase)*.ps1' ':(icase)*.sh')
          if [[ -n "$legacy" ]]; then
            printf 'Unexpected interpreter source files remain tracked.\n' >&2
            exit 1
          fi
          grep -qx 'channel = "1.100.0"' rust-toolchain.toml
          for manifest in .claude-plugin/plugin.json .codex-plugin/plugin.json .cursor-plugin/plugin.json .antigravity-plugin/plugin.json plugin.json; do
            jq -e '.name == "revayat-novel" and .version == "3.0.0" and .license == "GPL-3.0-or-later"' "$manifest" >/dev/null
          done
          for marketplace in .claude-plugin/marketplace.json .agents/plugins/marketplace.json .cursor-plugin/marketplace.json; do
            jq -e 'any(.plugins[]; .name == "revayat-novel" and (.version // "3.0.0") == "3.0.0")' "$marketplace" >/dev/null
          done
          for skill in revayat-novel persian great-russian humanizer; do
            awk -v skill="$skill" '
              NR == 1 { if ($0 != "---") exit 1; next }
              $0 == "---" { closed = 1; exit }
              !/^[a-z][a-z0-9_-]*:[[:blank:]]+[^[:blank:]]/ || /:[[:blank:]]*[|>][-+0-9]*[[:blank:]]*$/ { exit 1 }
              /^name:/ { name = ($0 == "name: " skill) }
              /^description:/ { description = 1 }
              END { if (!closed || !name || !description) exit 1 }
            ' "skills/$skill/SKILL.md"
          done
          fonts=skills/revayat-novel/assets/fonts/vazirmatn
          for weight in Regular Bold Medium Light; do test -s "$fonts/Vazirmatn-$weight.ttf"; done
          test -s "$fonts/OFL.txt"
          while IFS= read -r -d '' file; do
            lines=$(awk 'END { print NR }' "$file")
            if (( lines > 800 )); then
              printf 'Tracked source exceeds 800 lines: %s (%s).\n' "$file" "$lines" >&2
              exit 1
            fi
          done < <(git ls-files -z -- '*.rs' '*.toml' '*.yml' '*.yaml' '*.json' '*.md' ':(glob)**/Dockerfile')

  installer-smoke-linux:
    name: Installer smoke (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install and verify all eight project targets
        shell: bash
        run: |
          cargo build --locked --bin revayat-novel
          mkdir -p bin
          install -m 755 target/debug/revayat-novel bin/revayat-novel
          agents=(.claude .kiro .codex .cursor .cline .hermes .opencode .agents)
          for agent in "${agents[@]}"; do mkdir -p "$RUNNER_TEMP/proj/$agent"; done
          ./bin/revayat-novel install --agent all --scope project --path "$RUNNER_TEMP/proj" \
            | jq -e '.committed == true and .cleanup_pending == false and .journal == null'
          for agent in "${agents[@]}"; do
            skill="$RUNNER_TEMP/proj/$agent/skills/revayat-novel"
            cmp skills/revayat-novel/SKILL.md "$skill/SKILL.md"
            cmp bin/revayat-novel "$skill/bin/revayat-novel"
            test -x "$skill/bin/revayat-novel"
            for font in Vazirmatn-{Regular,Bold,Medium,Light}.ttf OFL.txt; do
              cmp "skills/revayat-novel/assets/fonts/vazirmatn/$font" "$skill/assets/fonts/vazirmatn/$font"
            done
          done
          ./bin/revayat-novel install --agent all --scope project --path "$RUNNER_TEMP/proj" --status \
            | jq -e '.status == "committed" and .installed == 8 and .receipts == 1 and .backups == 0'

  installer-smoke-windows:
    name: Installer smoke (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install and verify all eight project targets
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked --bin revayat-novel
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item target/debug/revayat-novel.exe bin
          $project = Join-Path $env:RUNNER_TEMP 'proj'
          $agents = '.claude', '.kiro', '.codex', '.cursor', '.cline', '.hermes', '.opencode', '.agents'
          foreach ($agent in $agents) {
            New-Item -ItemType Directory -Force (Join-Path $project $agent) | Out-Null
          }
          $report = ./bin/revayat-novel.exe install --agent all --scope project --path $project | ConvertFrom-Json
          if ($report.committed -cne $true -or $report.cleanup_pending -cne $false -or $null -ne $report.journal) {
            throw 'The installer did not commit cleanly.'
          }
          $files = @('SKILL.md', 'bin/revayat-novel.exe')
          $files += 'Regular', 'Bold', 'Medium', 'Light' | ForEach-Object { "assets/fonts/vazirmatn/Vazirmatn-$_.ttf" }
          $files += 'assets/fonts/vazirmatn/OFL.txt'
          foreach ($agent in $agents) {
            $skill = Join-Path $project "$agent/skills/revayat-novel"
            foreach ($file in $files) {
              $source = if ($file -like 'bin/*') { $file } else { "skills/revayat-novel/$file" }
              if ((Get-FileHash -LiteralPath $source).Hash -cne (Get-FileHash -LiteralPath (Join-Path $skill $file)).Hash) {
                throw "The installer changed $file in $agent."
              }
            }
          }
          $status = ./bin/revayat-novel.exe install --agent all --scope project --path $project --status | ConvertFrom-Json
          if ($status.status -cne 'committed' -or $status.installed -ne 8 -or $status.receipts -ne 1 -or $status.backups -ne 0) {
            throw 'Installer status did not confirm eight installed targets and one clean receipt.'
          }

  integration-ocr-linux:
    name: OCR integration (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run ingestion tests with English and Persian OCR available
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-fas
          languages=$(tesseract --list-langs)
          grep -qx eng <<< "$languages"
          grep -qx fas <<< "$languages"
          cargo test -p revayat-ingest --locked
          cargo run --locked --bin revayat-novel -- doctor --json | jq -e '.optional_tools.tesseract | type == "string" and length > 0'

  integration-render-linux:
    name: Rendering integration (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run document and pipeline tests with LibreOffice available
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          cargo test -p revayat-ooxml -p revayat-pipeline --locked
          cargo build --locked --bin revayat-novel
          mkdir -p bin
          install -m 755 target/debug/revayat-novel bin/revayat-novel
          ./bin/revayat-novel doctor --json | jq -e '.optional_tools.libreoffice | type == "string" and (split("/") | last | . == "soffice" or . == "libreoffice")'
          work=$(mktemp -d "$RUNNER_TEMP/render.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          printf '%s\n' 'این کتاب را می‌خوانم.' > "$work/sample.txt"
          ./bin/revayat-novel extract "$work/sample.txt" --out "$work/book"
          ./bin/revayat-novel build "$work/book" --out "$work/sample.docx"
          ./bin/revayat-novel wordrender "$work/sample.docx" --out "$work/render" --timeout 60
          test -s "$work/render/sample.pdf"

  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: '1.33.1'
          advanced-security: false
