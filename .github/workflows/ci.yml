name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # All three platforms people actually run this on, at the oldest and
        # newest supported interpreters.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/revayat/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skills/revayat/requirements.txt

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests -q --timeout=120 --durations=10

      - name: Smoke-test the CLI
        env:
          PYTHONIOENCODING: utf-8
        run: python skills/revayat/scripts/revayat.py doctor

  pipeline:
    name: end-to-end pipeline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/revayat/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skills/revayat/requirements.txt

      # Runs every stage against a generated book, so a break anywhere in the
      # chain fails here even when each module's unit tests still pass.
      - name: extract -> chunk -> merge -> typography -> QA -> build -> verify
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/e2e_pipeline.py

  install:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install into every agent layout (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash -n install/install.sh
          target="$(mktemp -d)"
          for dir in .claude .kiro .codex .cursor .cline .hermes .opencode .agents; do
            mkdir -p "$target/$dir"
          done
          bash install/install.sh --scope project --path "$target" --agent all --force
          found=$(find "$target" -name SKILL.md | wc -l | tr -d ' ')
          test "$found" -eq 8 || { echo "expected 8 skill copies, found $found"; exit 1; }
          test -f "$target/AGENTS.md"
          # Re-running must replace the pointer section, never stack copies.
          bash install/install.sh --scope project --path "$target" --agent opencode --force
          marks=$(grep -c 'BEGIN revayat' "$target/AGENTS.md")
          test "$marks" -eq 1 || { echo "AGENTS.md pointer duplicated ($marks)"; exit 1; }
          test -z "$(find "$target" -name __pycache__)"
          echo "installer OK: 8 copies, single pointer, no caches"

      - name: Install into every agent layout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parseErrors = $null
          $scriptPath = (Resolve-Path 'install/install.ps1').Path
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath, [ref]$null, [ref]$parseErrors)
          if ($parseErrors) { $parseErrors; throw 'install.ps1 does not parse' }

          $target = Join-Path ([System.IO.Path]::GetTempPath()) ([guid]::NewGuid().ToString('N'))
          foreach ($d in '.claude','.kiro','.codex','.cursor','.cline','.hermes','.opencode','.agents') {
            New-Item -ItemType Directory -Path (Join-Path $target $d) -Force | Out-Null
          }
          & ./install/install.ps1 -Agent all -Scope project -Path $target -Force | Out-Null
          $found = @(Get-ChildItem -Path $target -Recurse -Filter SKILL.md).Count
          if ($found -ne 8) { throw "expected 8 skill copies, found $found" }
          if (-not (Test-Path (Join-Path $target 'AGENTS.md'))) { throw 'no AGENTS.md pointer' }
          & ./install/install.ps1 -Agent opencode -Scope project -Path $target -Force | Out-Null
          $marks = (Select-String -Path (Join-Path $target 'AGENTS.md') -Pattern 'BEGIN revayat').Count
          if ($marks -ne 1) { throw "AGENTS.md pointer duplicated ($marks)" }
          Write-Output 'installer OK: 8 copies, single pointer'

  lint:
    name: manifests and encoding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/revayat/requirements.txt

      # Two checks below import the project, so they need its dependencies.
      # Without them pytest collects nothing and the coverage check reads that
      # as "every suite is unreachable".
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skills/revayat/requirements.txt

      - name: Every plugin manifest is valid JSON and agrees on version
        run: |
          python - <<'PY'
          import json, pathlib

          manifests = sorted(pathlib.Path(".").glob("*-plugin/plugin.json"))
          assert manifests, "no plugin manifests found"
          versions = set()
          for path in manifests:
              data = json.loads(path.read_text(encoding="utf-8"))
              for field in ("name", "version", "description", "license"):
                  assert data.get(field), f"{path}: missing {field}"
              versions.add(data["version"])
              print(f"ok {path} -> {data['name']} {data['version']}")

          market = json.loads(
              pathlib.Path(".claude-plugin/marketplace.json").read_text(encoding="utf-8")
          )
          versions.add(market["plugins"][0]["version"])
          assert len(versions) == 1, f"plugin versions disagree: {versions}"
          print("ok marketplace.json, all manifests at", versions.pop())
          PY

      - name: Every tracked text file is valid UTF-8
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys

          binary_suffixes = {
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".pdf", ".docx",
              ".epub", ".zip", ".ico", ".woff", ".woff2", ".ttf", ".otf",
          }
          tracked = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, check=True
          ).stdout.split(b"\0")

          bad = []
          for raw in tracked:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode("utf-8"))
              if path.suffix.lower() in binary_suffixes or not path.is_file():
                  continue
              try:
                  path.read_bytes().decode("utf-8")
              except UnicodeDecodeError as error:
                  bad.append(f"{path}: {error}")

          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("ok: all tracked text files decode as UTF-8")
          PY

      - name: The skill declares itself correctly
        run: |
          python - <<'PY'
          import pathlib, re

          text = pathlib.Path("skills/revayat/SKILL.md").read_text(encoding="utf-8")
          front = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          assert front, "SKILL.md has no YAML front matter"
          body = front.group(1)
          for field in ("name:", "description:"):
              assert field in body, f"SKILL.md front matter is missing {field}"
          # Several agents parse this front matter with a line-oriented reader,
          # so every field has to stay on one line.
          for line in body.splitlines():
              assert not line.startswith(" "), f"front matter must be flat: {line!r}"
          name = re.search(r"^name:\s*(\S+)", body, re.M).group(1)
          assert name == "revayat", f"skill name drifted: {name}"

          referenced = set(re.findall(r"references/([a-z0-9-]+\.md)", text))
          on_disk = {p.name for p in pathlib.Path("skills/revayat/references").glob("*.md")}
          missing = referenced - on_disk
          assert not missing, f"SKILL.md references files that do not exist: {missing}"
          print(f"ok: skill '{name}', {len(on_disk)} reference files, none dangling")
          PY

      - name: Every command the docs promise actually exists
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys

          stages = subprocess.run(
              [sys.executable, "skills/revayat/scripts/revayat.py", "--help"],
              capture_output=True, text=True, check=True,
          ).stdout
          available = set(re.search(r"stages: (.+)", stages).group(1).split(", "))

          docs = [pathlib.Path("README.md"), pathlib.Path("skills/revayat/SKILL.md")]
          docs += list(pathlib.Path("skills/revayat/references").glob("*.md"))

          used = set()
          for doc in docs:
              # A stage name may contain a hyphen (`ocr-sidecar`). Stopping at
              # one turns it into `ocr`, which is not a stage, so the guard
              # fails on documentation that is in fact correct.
              used |= set(re.findall(r"revayat\.py\s+([a-z][a-z_-]*)",
                                     doc.read_text(encoding="utf-8")))

          unknown = used - available
          assert not unknown, f"docs reference stages that do not exist: {unknown}"
          print(f"ok: {len(used)} documented stages, all real ({sorted(available)})")
          PY

      - name: Every test suite on disk is reachable
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys

          on_disk = {p.name for p in pathlib.Path("tests").glob("test_*.py")}
          run = subprocess.run(
              [sys.executable, "-m", "pytest", "tests", "--collect-only", "-q"],
              capture_output=True, text=True,
          )
          # Without this, a collection error would look like "no suite is
          # reachable" and point the blame at the wrong thing entirely.
          assert run.returncode == 0, (
              "pytest could not collect at all: "
              + run.stdout[-1500:] + run.stderr[-1500:]
          )
          missing = [name for name in on_disk if name.replace(".py", "") not in run.stdout]
          assert not missing, f"test files never collected by CI: {missing}"
          print(f"ok: all {len(on_disk)} test modules are collected")
          PY
