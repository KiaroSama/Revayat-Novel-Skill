name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  schedule:
    - cron: '49 4 * * 1'

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Protect scan diagnostics
        shell: bash
        run: |
          if [[ "${RUNNER_DEBUG:-}" == 1 ]]; then
            printf '%s\n' 'Disable Actions step debug logging before scanning; checkout debug output can expose commit contents.' >&2
            exit 1
          fi
      - name: Check out the complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with the verified Gitleaks CLI
        shell: bash
        run: |
          fail() { printf 'Gitleaks: %s\n' "$1" >&2; exit 1; }
          umask 077
          scan=$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXXXX")
          trap 'rm -rf -- "$scan"' EXIT
          version=8.30.1
          digest=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --max-time 60 \
            "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$scan/gitleaks.tar.gz"
          printf '%s  %s\n' "$digest" "$scan/gitleaks.tar.gz" | sha256sum --check --status \
            || fail 'Download checksum does not match the pinned release.'
          tar -xOzf "$scan/gitleaks.tar.gz" -- gitleaks > "$scan/gitleaks"
          chmod 700 "$scan/gitleaks"
          [[ "$(timeout 15s "$scan/gitleaks" version 2> "$scan/diagnostics")" == "$version" ]] \
            || fail 'The executable version could not be verified.'
          printf '[extend]\nuseDefault = true\n' > "$scan/scanner.toml"
          git_dir="$GITHUB_WORKSPACE/.git"
          [[ -d "$git_dir" ]] || fail 'The complete Git checkout is unavailable.'
          log_opts='--full-history --diff-filter=uxdb --no-ext-diff --no-textconv --ignore-submodules=all -m'
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base=$(jq -er '.pull_request.base.sha | strings | select(test("^[0-9a-fA-F]{40}$"))' "$GITHUB_EVENT_PATH")
            head=$(jq -er '.pull_request.head.sha | strings | select(test("^[0-9a-fA-F]{40}$"))' "$GITHUB_EVENT_PATH")
            for revision in "$base" "$head"; do
              timeout 15s git -C "$git_dir" cat-file -e "$revision^{commit}" > "$scan/diagnostics" 2>&1 \
                || fail 'A pull request revision is missing from the full checkout.'
            done
            log_opts+=" $base..$head"
            scope='Commits introduced by this pull request, including merge diffs'
          else
            log_opts+=' --all'
            scope='All fetched branches and tags, including full history and merge diffs'
          fi
          export GITLEAKS_REAL_GIT GITLEAKS_GIT_STATUS="$scan/git-status"
          GITLEAKS_REAL_GIT=$(command -v git)
          # Gitleaks can return zero even if its Git-history child failed.
          cat > "$scan/git" <<'BASH'
          #!/bin/bash
          "$GITLEAKS_REAL_GIT" "$@"
          result=$?
          if [[ "${3:-}" == log ]]; then printf '%s\n' "$result" > "$GITLEAKS_GIT_STATUS"; fi
          exit "$result"
          BASH
          chmod 700 "$scan/git"
          result=0
          # Scanner diagnostics and the raw report can contain commit contents.
          PATH="$scan:$PATH" timeout --kill-after=10s 930s "$scan/gitleaks" git "$git_dir" \
            --config "$scan/scanner.toml" --gitleaks-ignore-path "$scan" \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color --log-level=error --exit-code=2 \
            --report-format=json --report-path "$scan/findings.json" --log-opts="$log_opts" \
            > "$scan/diagnostics" 2>&1 || result=$?
          [[ "$result" == 0 || "$result" == 2 ]] || fail "Scan failed with exit code $result; no clean result was recorded."
          [[ ! -s "$scan/diagnostics" ]] || fail 'The scanner reported errors; no clean result was recorded.'
          [[ -f "$scan/git-status" && "$(< "$scan/git-status")" == 0 ]] \
            || fail 'The Git-history child did not confirm successful completion.'
          count=$(jq -ers 'if length == 1 and (.[0] | type == "array" and all(.[]; type == "object")) then .[0] | length else error("Invalid report") end' \
            "$scan/findings.json" 2> "$scan/diagnostics") || fail 'The scanner report is invalid.'
          [[ ( "$result" == 0 && "$count" == 0 ) || ( "$result" == 2 && "$count" != 0 ) ]] \
            || fail 'The scanner result and report disagree.'
          {
            printf '## Gitleaks\n\nScanner: **%s**\n\nScope: %s.\n\n' "$version" "$scope"
            printf '%s\n\n' 'The scan uses the pinned built-in rules. It does not certify every byte or credential.'
            if (( count == 0 )); then
              printf 'No matching secrets were found in the scanned Git history.\n'
            else
              printf '**%s potential secrets detected.** Review the locations and rotate any real exposed credentials.\n\n' "$count"
              printf '| Rule | File | Line | Commit |\n| --- | --- | --- | --- |\n'
              jq -r 'def cell: tostring | gsub("[[:cntrl:]]"; " ") | @html | gsub("[|]"; "&#124;");
                .[:200][] | [(.RuleID // ""), (.File // ""), (.StartLine // ""), (.Commit // "")]
                | map("<code>" + cell + "</code>") | "| " + join(" | ") + " |"' \
                "$scan/findings.json" 2> "$scan/diagnostics"
              if (( count > 200 )); then printf '\nShowing the first 200 findings.\n'; fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if (( count != 0 )); then fail 'Potential secrets detected. See the sanitized job summary.'; fi
          printf 'Gitleaks found no matching secrets.\n'
