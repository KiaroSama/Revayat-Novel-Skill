version: 2
updates:
  # Version updates are disabled here on purpose. requirements.txt states the
  # *minimum* version each dependency is known to work with, so raising those
  # floors weekly would narrow the range of environments the skill installs on
  # without fixing anything. Security updates ignore this limit and still open
  # pull requests.
  - package-ecosystem: pip
    directory: /skills/revayat-novel
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # The pins CI installs against. These are exact versions, so an update here
  # is a real, reviewable change — unlike the floors in requirements.txt, which
  # are deliberately not raised (see the entry above). Grouped, because the
  # point of reading them is whether the suite is still green as a set.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      ci-constraints:
        patterns: ["*"]

  # Actions are pinned by major tag, so these updates are real and worth having:
  # a deprecated runner action breaks CI silently otherwise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
