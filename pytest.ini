# Bounds the suite wherever it runs, including a bare `pytest tests`.
#
# Before this, the only per-test ceiling was a `--timeout` flag written four
# times across three workflows with three different values — so the command
# AGENTS.md hands a contributor had no ceiling at all, and a deadlocking test
# there hangs until a person notices. pytest-timeout is already a declared
# dependency; this is what makes it do something.
#
# 300s is a ceiling, not an expectation. Measured on 2026-09-12 (663 tests,
# Windows, Word installed), the slowest legitimate tests are the doc-qa ones at
# 35-62s, each of which lays a real document out three times. The one test
# above this ceiling is test_readers.py::test_a_pdf_declaring_too_many_pages_…
# at 131s, which still clears it; see plans/032 for why it is that slow.
#
# `thread` rather than `signal`: the signal method needs SIGALRM, which Windows
# does not have, and this project is developed on Windows and tested on three
# platforms. A thread-method timeout cannot interrupt a C call that never
# returns to the interpreter — the outer guarded runner is the backstop for
# that, which is why both exist.
[pytest]
timeout = 300
timeout_method = thread
testpaths = tests
